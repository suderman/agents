name: Update flake.lock

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 02:00 MST (UTC-7), 03:00 MDT.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flake-lock

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Nix (v31.11.1)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          # yamllint disable rule:line-length
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          # yamllint enable rule:line-length

      - name: Update flake
        run: nix flake update

      - name: Check and build packages
        run: |
          nix flake check --all-systems
          fixture="$(mktemp -d)"
          trap 'rm -rf -- "$fixture"' EXIT
          HOME="$fixture" lib/skills materialize
          pi/test-bootstrap
          opencode/test-bootstrap
          nix shell nixpkgs#yq-go --command python3 -B tests/test_skills.py
          nix shell nixpkgs#yq-go --command python3 -B tests/test_agents.py
          tests/test-prompts
          tests/test-update-flake-lock
          nix shell nixpkgs#yq-go --command hermes/test-bootstrap
          nix build .#pi .#opencode .#hermes-agent .#claude-code --no-link
          env -i PATH="$PATH" HOME="$fixture/pi" \
            "$(nix eval --raw .#pi.outPath)/bin/pi" --version
          HOME="$fixture/pi" pi/test-codemode "$(nix eval --raw .#pi.outPath)"
          pi/test-clipboard "$(nix eval --raw .#pi.outPath)"
          env -i PATH="$PATH" HOME="$fixture/opencode" \
            "$(nix eval --raw .#opencode.outPath)/bin/opencode" --version
          env -i PATH="$PATH" HOME="$fixture/hermes" \
            "$(nix eval --raw .#hermes-agent.outPath)/bin/hermes" --help
          env -i PATH="$PATH" HOME="$fixture/claude" \
            "$(nix eval --raw .#claude-code.outPath)/bin/claude" --version

      - name: Commit and push if flake.lock changed
        run: |
          if git diff --quiet -- flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Automated flake.lock update"
          git pull --rebase
          git push
