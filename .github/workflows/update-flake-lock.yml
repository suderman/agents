name: Update flake.lock

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 02:00 MST (UTC-7), 03:00 MDT.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flake-lock

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Nix (v31.11.1)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          # yamllint disable rule:line-length
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          # yamllint enable rule:line-length

      - name: Update flake
        run: nix flake update

      - name: Check and build packages
        run: |
          nix flake check --all-systems
          lib/skills materialize
          harnesses/pi/test-bootstrap
          harnesses/opencode/test-bootstrap
          nix shell nixpkgs#yq-go --command python3 -B tests/test_skills.py
          tests/test-prompts
          tests/test-update-flake-lock
          python3 -B skills/sheepdog/scripts/test_sheepdog.py
          nix shell nixpkgs#yq-go --command harnesses/hermes/test-bootstrap
          nix build .#pi .#opencode .#hermes-agent --no-link
          nix run .#pi -- --version
          harnesses/pi/test-codemode "$(nix eval --raw .#pi.outPath)"
          nix run .#opencode -- --version
          nix run .#hermes-agent -- --version

      - name: Commit and push if flake.lock changed
        run: |
          if git diff --quiet -- flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Automated flake.lock update"
          git pull --rebase
          git push
